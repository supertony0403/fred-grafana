# kamera.benz-sw.de – Fisheye-Kamera als Live-Bild hinter HTTP-Basic-Auth.
# Das Bild kommt vom fred-relay (/kamera/fisheye.jpg); nur dieser eine Pfad wird durchgereicht.
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  # Relay-Host erst zur Laufzeit aufloesen, damit nginx auch ohne Relay-Service startet.
  resolver 10.43.0.10 valid=30s ipv6=off;

  server {
    listen 443 ssl;
    http2 on;
    server_name kamera.benz-sw.de;
    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Kamera";
    auth_basic_user_file /auth/htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; connect-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    set $fred_relay fred-relay.monitoring.svc.cluster.local;

    location = / {
      root /usr/share/nginx/html;
      try_files /index.html =404;
    }

    # Mit Variable im proxy_pass wird die URI 1:1 verwendet – der Cache-Buster ?t=… faellt weg.
    location = /fisheye.jpg {
      limit_except GET { deny all; }
      proxy_pass http://$fred_relay:8080/kamera/fisheye.jpg;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;
      proxy_hide_header Content-Security-Policy;
    }

    # Alter der Kamerabilder (nur {name: {alter_s, ok}}), damit die Seite ein eingefrorenes Bild erkennt.
    location = /status {
      limit_except GET { deny all; }
      proxy_pass http://$fred_relay:8080/kamera/;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;
    }

    location = /favicon.ico { access_log off; return 204; }

    location / { return 404; }
  }
}
