worker_processes 1;
events { worker_connections 1024; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 443 ssl;
    http2 on;
    server_name grafana.benz-sw.de;
    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    # Relay-Host erst zur Laufzeit aufloesen: fehlt der Service, startet nginx trotzdem
    # (sonst waere mit dem Relay ganz Grafana weg). Die Pfad-Whitelist prueft das Relay.
    resolver 10.43.0.10 valid=30s ipv6=off;
    set $fred_relay fred-relay.monitoring.svc.cluster.local;

    # Kamerabilder fuer das Fred-Dashboard: nur fuer angemeldete Grafana-Nutzer.
    location /kamera/ {
      auth_request /_grafana_auth;
      limit_except GET { deny all; }
      proxy_pass http://$fred_relay:8080;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_hide_header Set-Cookie;
      add_header X-Content-Type-Options nosniff always;
    }
    location = /_grafana_auth {
      internal;
      proxy_pass http://kps-grafana.monitoring.svc.cluster.local:80/api/user;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://kps-grafana.monitoring.svc.cluster.local:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
